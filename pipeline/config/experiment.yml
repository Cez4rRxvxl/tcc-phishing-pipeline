# config/experiment.yml — contrato do experimento (SDD §7.1, RF5, T4.1)
#
# Este arquivo é a ÚNICA fonte de hiperparâmetros. Nenhum valor de modelo pode
# ser escrito em código Python: `src/models.py` só lê daqui.
#
# ⛔ REGRA DURA (SDD §4 D5) — hiperparâmetros NUNCA são re-otimizados por
# corpus. A Etapa 1 (baseline "seco") usa exatamente os valores abaixo em
# todos os 4 corpora e nos 2 regimes. Se fossem ajustados por corpus, a queda
# fora da diagonal viria de overfit de tuning e não de diferença de
# distribuição — e a matriz deixaria de medir o que o artigo afirma medir.
# A Etapa 2 (HPO, T4.5) roda exclusivamente no Grambeddings e é reportada como
# ablação, num arquivo separado; ela não altera nada aqui.

# --- Reprodutibilidade (RNF1) -----------------------------------------------
# Seed única, propagada para os splits e para todos os estimadores.
seed: 42

# --- Corpora (SDD §4 D2) ----------------------------------------------------
corpora:
  # Treino e avaliação — formam a matriz cruzada 4x4.
  treino_avaliacao:
    - grambeddings
    - kaggle03
    - phishstorm
    - iscx2016
  # Demonstração de viés de construção (§ Ameaças à Validade). NUNCA treinam:
  # gap de scheme medido de 59,9 p (sid321axn) e 94,9 p (pdrcnn) — ver §3.2.
  # Restrição R6 do SDD.
  demonstracao_vies:
    - pdrcnn
    - sid321axn

# --- Regimes de split (SDD §4 D3) -------------------------------------------
regimes:
  - oficial   # Regime A: split distribuído pela fonte (reproduz a literatura)
  - etld1     # Regime B: re-split por eTLD+1 (livre de vazamento)

split:
  # Regime B: frações do corpus inteiro.
  test_size: 0.20
  val_size: 0.10
  # Regime A: fração do treino OFICIAL reservada para validação (o teste tem
  # tamanho fixado pela fonte). Ver a nota em src/splits.py sobre por que essa
  # validação é aleatória estratificada e não agrupada por domínio.
  val_size_oficial: 0.10

# --- Ponto de operação (SDD §4 D6) ------------------------------------------
avaliacao:
  # Métricas primárias da matriz são independentes de limiar (AUROC, AUC-PR).
  # As secundárias usam um limiar escolhido na VALIDAÇÃO DO CORPUS DE TREINO,
  # nunca no teste, e nunca recalibrado no corpus de teste.
  criterio_limiar: f1        # "f1" | "youden"
  ece_bins: 15               # Guo et al. (2017), bins de largura igual
  # Sem recalibração no baseline (D6): Brier e ECE são reportados como saem
  # do modelo. Recalibrar aqui esconderia justamente o que B8 revelou.
  recalibrar: false
  # Intervalo de confiança de AUROC e AUC-PR por bootstrap estratificado
  # (05/08/2026). Mede a incerteza de AMOSTRAGEM DO TESTE, que é a que domina
  # nos corpora pequenos: a largura medida vai de 0,0044 no Grambeddings
  # (160 mil linhas de teste) a 0,027 no ISCX (4 mil). A incerteza de
  # PARTIÇÃO é outra, e sai de rodar a matriz com outras seeds
  # (`run_all.py --seed`). O artigo precisa das duas.
  #
  # Custo medido nesta máquina com 500 reamostras: ~5,5 min para as 192 células
  # + ~1,4 min para as 48 do LOCO, por seed. É o primeiro número a baixar se o
  # orçamento do RNF5 apertar — 200 reamostras ainda é um percentil defensável.
  bootstrap_n: 500
  bootstrap_nivel: 0.95

# --- Modelos (SDD §4 D4) ----------------------------------------------------
#
# 6 modelos escolhidos por cobertura de família, não por quantidade.
# `escala: true` embrulha o estimador num Pipeline com StandardScaler.
# Isso NÃO é hiperparâmetro escondido: é requisito numérico dos dois modelos
# que dependem de gradiente. As features vão de 0/1 (booleanas) a ~65.000
# (url_length em uint16); sem padronizar, o lbfgs da LogisticRegression e o
# adam do MLP não convergem em número razoável de iterações. Modelos de
# árvore são invariantes a escala monotônica e não são embrulhados.
#
# Nenhum modelo usa `class_weight`/`scale_pos_weight`. Decisão deliberada:
# (a) pesos derivados dos dados variariam por corpus, contra o espírito do
# D5; (b) reponderar distorce a probabilidade prevista, e D6 exige reportar
# Brier e ECE sem recalibração — foi assim que B8 (Brier 0,5257 a 96% de
# acurácia) passou despercebido. O desbalanceamento é tratado no ponto de
# operação (limiar escolhido na validação), não na função de perda.

modelos:
  logistic_regression:
    familia: linear
    escala: true
    params:
      max_iter: 1000
      C: 1.0
      solver: lbfgs
      tol: 1.0e-4

  random_forest:
    familia: bagging
    escala: false
    params:
      n_estimators: 300
      max_depth: null          # cresce até as folhas puras
      min_samples_leaf: 2
      max_features: sqrt
      n_jobs: -1

  xgboost:
    familia: boosting
    escala: false
    params:
      n_estimators: 400
      max_depth: 8
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_weight: 1
      reg_lambda: 1.0
      tree_method: hist        # 'hist' é determinístico em CPU e em GPU
      eval_metric: logloss

  lightgbm:
    familia: boosting
    escala: false
    params:
      n_estimators: 400
      num_leaves: 63
      max_depth: -1
      learning_rate: 0.1
      subsample: 0.8
      subsample_freq: 1
      colsample_bytree: 0.8
      min_child_samples: 20
      reg_lambda: 1.0
      verbose: -1
      # RNF1: sem estes dois, a redução paralela do LightGBM pode variar a
      # ordem das somas em ponto flutuante entre execuções.
      deterministic: true
      force_row_wise: true

  catboost:
    familia: boosting
    escala: false
    params:
      iterations: 400
      depth: 8
      learning_rate: 0.1
      l2_leaf_reg: 3.0
      verbose: false
      allow_writing_files: false   # não sujar o repo com catboost_info/ (limpeza do legado)

  mlp:
    familia: rede_neural
    escala: true
    params:
      hidden_layer_sizes: [128, 64]
      activation: relu
      solver: adam
      alpha: 1.0e-4
      learning_rate_init: 1.0e-3
      max_iter: 200
      early_stopping: true
      n_iter_no_change: 10
      validation_fraction: 0.1

# --- GPU (RF10, RH4) --------------------------------------------------------
gpu:
  # Detecção automática, sem flag manual. Se não houver GPU, cai para CPU em
  # silêncio (só um registro no log). Ver src/models.py::detect_gpu.
  auto: true
  # Modelos que sabem usar GPU nas wheels que instalamos:
  #   xgboost  -> device="cuda"
  #   catboost -> task_type="GPU"
  # LightGBM está deliberadamente FORA: a wheel oficial do PyPI é compilada
  # sem o tree learner de GPU/OpenCL, e passar device="gpu" nela levanta
  # "GPU Tree Learner was not enabled in this build". Deixar ligado quebraria
  # a máquina do Lucas sem ganho. Ele roda em CPU nos dois ambientes — o que
  # também torna o resultado do LightGBM comparável entre as duas máquinas.
  habilitado_para:
    - xgboost
    - catboost

# --- Paralelismo em CPU -----------------------------------------------------
cpu:
  n_jobs: -1   # todos os núcleos (esta máquina: 12; a do Lucas: ver §13.3)

# --- Smoke test (T4.4, RF9) -------------------------------------------------
#
# O smoke é o PORTÃO de entrega (SDD §8.2): valida a fiação do pipeline
# inteiro — carga, canonização, features, os 2 regimes, os 6 modelos, a matriz
# cruzada, o leave-one-corpus-out e as métricas — em amostra pequena.
#
# NÃO produz resultado científico: os overrides abaixo cortam o orçamento de
# cada modelo ao mínimo. Qualquer número que saia do smoke é descartável, e
# `run_smoke.py` grava em results/smoke/ justamente para não se confundir com
# results/ de verdade.
smoke:
  sample_size: 5000            # por corpus, teto absoluto do DoD da T4.4
  # 120 s desde 05/08/2026 (era 60). O portão passou a exercitar também o LOCO,
  # que são 48 ajustes a mais: sem isso o LOCO seria o único caminho que o Lucas
  # roda sem o smoke ter tocado, que é o RK5 de volta. Medido: 17,5 s -> 104 s.
  # A decisão está na §11; cortar modelos do LOCO no smoke economizaria segundos
  # e devolveria o buraco de cobertura, então o orçamento subiu em vez disso.
  # Este valor NÃO entra no config_fingerprint (ver matrix.config_fingerprint).
  tempo_limite_s: 120
  # IC por bootstrap desligado no portão: o número do smoke é descartável e o
  # IC custaria ~7 min, contra os 120 s do orçamento. A fiação da chamada
  # continua exercitada pela execução real e pelos testes.
  bootstrap_n: 0
  overrides:
    logistic_regression:
      max_iter: 200
    random_forest:
      n_estimators: 40
    xgboost:
      n_estimators: 40
      max_depth: 4
    lightgbm:
      n_estimators: 40
      num_leaves: 15
    catboost:
      iterations: 40
      depth: 4
    mlp:
      hidden_layer_sizes: [32]
      max_iter: 30
